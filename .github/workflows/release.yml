# Experimental unsigned IPA build (manual).
# Adapted from upstream: uploads the .ipa as an Actions artifact instead of
# creating a GitHub Release.

name: Experimental IPA (manual)

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build the unsigned .ipa for"
        required: true

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  TAG: ${{ github.event.inputs.tag || github.ref_name }}
  IPA: Tolkara-unsigned.ipa

jobs:
  ipa:
    name: Unsigned .ipa
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.TAG }}
          fetch-depth: 0

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Build the unsigned .ipa
        run: TOLKARA_SYSTEM_ROOTS=NO tools/package_ipa.sh "$IPA"

      - name: Upload the .ipa
        uses: actions/upload-artifact@v4
        with:
          name: Wolkara-unsigned-ipa
          path: ${{ env.IPA }}
          retention-days: 30

      - name: Keep the build log if it failed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: logs/
          retention-days: 7
          if-no-files-found: ignore
